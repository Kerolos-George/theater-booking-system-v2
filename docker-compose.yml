services:
  backend:
    build:
      context: ./backend
    container_name: theater-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: theater-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
